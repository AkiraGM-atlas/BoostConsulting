services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boost
      POSTGRES_PASSWORD: boost_local_only
      POSTGRES_DB: boost
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - boost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boost -d boost"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  boost-postgres:
